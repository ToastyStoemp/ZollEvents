# Run from the repo root:  docker compose up -d --build
#
# No .env needed to start: open /admin and the first-run setup wizard captures the
# admin password, the ZollTool source (URL + token), the public base URL, and
# branding — all saved to /data (the mounted volume). Everything below is OPTIONAL
# and only overrides the wizard when set (headless / secrets-manager provisioning).
# This service is PUBLIC-facing (Shopify + calendar apps fetch it) — put it behind
# a TLS reverse proxy; set the public HTTPS origin in the wizard or via PUBLIC_BASE_URL.
services:
  zollevents:
    container_name: zollevents
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4300:4300'
    volumes:
      - ./data:/data
    environment:
      PORT: 4300
      ZOLLEVENTS_DATA_DIR: /data
      # All optional — set only to override what the wizard would store.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ZOLLTOOL_URL: ${ZOLLTOOL_URL:-}
      ZOLLTOOL_API_TOKEN: ${ZOLLTOOL_API_TOKEN:-}
      ORG_NAME: ${ORG_NAME:-}
      ORG_TAGLINE: ${ORG_TAGLINE:-}
      SHOW_PAST: ${SHOW_PAST:-}
      PAST_LIMIT: ${PAST_LIMIT:-}
      EVENTS_TTL_MS: ${EVENTS_TTL_MS:-}
      # Legacy: a fixed admin password instead of the wizard's stored one.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Trust X-Forwarded-For (login rate limit) — enable behind a reverse proxy.
      ZOLLEVENTS_TRUST_PROXY: ${ZOLLEVENTS_TRUST_PROXY:-1}
    restart: unless-stopped
